name: Discord Push Notifications

on:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Main Branch (Green Push / Blue Merge)
      - name: Notify Main Branch (Smart Detection)
        if: github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PARENT_COUNT=$(git log -1 --format=%P | wc -w)

          if [ "$PARENT_COUNT" -gt 1 ]; then
            IS_MERGE="true"
          else
            IS_MERGE="false"
          fi

          PAYLOAD=$(jq -n \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg url "${{ github.event.compare }}" \
            --arg is_merge "$IS_MERGE" \
            '{
              username: "GitHub",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                if $is_merge == "true" then
                  {
                    color: 616922,
                    title: "🔀 Code Merged into Main",
                    url: $url,
                    description: "**\($actor)** merged code into `\($ref)`.\n\n> \($commit)"
                  }
                else
                  {
                    color: 2328118,
                    title: "🚀 CRITICAL UPDATE: Main Branch",
                    url: $url,
                    description: "**\($actor)** pushed directly to `\($ref)`.\n\n> \($commit)"
                  }
                end
              ]
            }')

          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK_URL

      # Step 2: Feature Branches (Yellow Push / Purple Merge)
      - name: Notify Feature Branch (Smart Detection)
        if: github.ref != 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PARENT_COUNT=$(git log -1 --format=%P | wc -w)

          if [ "$PARENT_COUNT" -gt 1 ]; then
            IS_MERGE="true"
          else
            IS_MERGE="false"
          fi

          PAYLOAD=$(jq -n \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg url "${{ github.event.compare }}" \
            --arg is_merge "$IS_MERGE" \
            '{
              username: "GitHub",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                if $is_merge == "true" then
                  {
                    color: 8540383,
                    title: "🔀 Code Merged into Branch",
                    url: $url,
                    description: "**\($actor)** merged code into `\($ref)`.\n\n> \($commit)"
                  }
                else
                  {
                    color: 13801762,
                    title: "📝 New Push to Branch",
                    url: $url,
                    description: "**\($actor)** pushed to `\($ref)`.\n\n> \($commit)"
                  }
                end
              ]
            }')

          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK_URL