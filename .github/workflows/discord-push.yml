name: Discord Push Notifications

on:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Trigger for MERGE commits to main
      - name: Notify Main Branch (Smart Detection)
        if: github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Count the number of parent commits on the latest push
          PARENT_COUNT=$(git log -1 --format=%P | wc -w)

          if [ "$PARENT_COUNT" -gt 1 ]; then
            IS_MERGE="true"
          else
            IS_MERGE="false"
          fi

          # jq dynamically builds the embed based on the IS_MERGE boolean
          PAYLOAD=$(jq -n \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg url "${{ github.event.compare }}" \
            --arg is_merge "$IS_MERGE" \
            '{
              username: "GitHub",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                if $is_merge == "true" then
                  {
                    color: 8270566,
                    title: "🔀 Code Merged into Main",
                    url: $url,
                    description: "**\($actor)** merged code into `\($ref)`.\n\n> \($commit)"
                  }
                else
                  {
                    color: 2328118,
                    title: "🚀 CRITICAL UPDATE: Main Branch",
                    url: $url,
                    description: "**\($actor)** pushed directly to `\($ref)`.\n\n> \($commit)"
                  }
                end
              ]
            }')

          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK_URL

      # Step 2: Standard message for all other branches
      - name: Notify Feature Branch Push
        if: github.ref != 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content": "📝 **New Push**\n**${{ github.actor }}** pushed to branch `${{ github.ref_name }}`.\n[View changes](${{ github.event.compare }})"
          }' \
          $DISCORD_WEBHOOK_URL