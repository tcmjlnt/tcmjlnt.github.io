name: Discord Push Notifications

on:
  push:
    branches:
      - '**' # Triggers on pushes to all branches

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Custom message for the 'main' branch
      - name: Notify Main Branch Push
        if: github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "username": "GitHub",
            "avatar_url": "[https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png](https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png)",
            "embeds": [
              {
                "color": 2328118,
                "title": "🚀 CRITICAL UPDATE: Main Branch",
                "url": "${{ github.event.compare }}",
                "description": "**${{ github.actor }}** pushed to `${{ github.ref_name }}` in **${{ github.repository }}**.\n\n>${{ github.event.head_commit.message }}"
              }
            ]
          }' \
          $DISCORD_WEBHOOK_URL

      # Step 2: Standard message for all other branches
      - name: Notify Feature Branch Push
        if: github.ref != 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content": "📝 **New Push**\n**${{ github.actor }}** pushed to branch `${{ github.ref_name }}`.\n[View changes](${{ github.event.compare }})"
          }' \
          $DISCORD_WEBHOOK_URL