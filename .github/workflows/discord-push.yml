name: Discord Push Notifications

on:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Step 1: Main Branch
      - name: Notify Main Branch (Smart Detection)
        if: github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PARENT_COUNT=$(git log -1 --format=%P | wc -w)
          SUBJECT=$(git log -1 --format=%s) # Gets only the first line of the commit

          if [ "$PARENT_COUNT" -gt 1 ]; then
            IS_MERGE="true"
            # Looks for standard terminal merge: Merge branch 'feat/auth'
            SOURCE_BRANCH=$(echo "$SUBJECT" | grep -oP "(?<=Merge branch ')[^']+" || true)
            # Fallback if merged via GitHub PR: Merge pull request #1 from org/feat/auth
            if [ -z "$SOURCE_BRANCH" ]; then
              SOURCE_BRANCH=$(echo "$SUBJECT" | grep -oP "(?<=from )[^ ]+" | cut -d'/' -f2- || true)
            fi
            # Final fallback if someone manually deleted the default Git message
            if [ -z "$SOURCE_BRANCH" ]; then
              SOURCE_BRANCH="another branch"
            fi
          else
            IS_MERGE="false"
            SOURCE_BRANCH=""
          fi

          PAYLOAD=$(jq -n \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg url "${{ github.event.compare }}" \
            --arg is_merge "$IS_MERGE" \
            --arg source "$SOURCE_BRANCH" \
            '{
              username: "GitHub",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                if $is_merge == "true" then
                  {
                    color: 616922,
                    title: "🚀 __**Code Merged into Main**__ 🚀",
                    url: $url,
                    description: "**\($actor)** merged `\($source)` into `\($ref)`.\n\n> \($commit)"
                  }
                else
                  {
                    color: 2328118,
                    title: "🌳 __**Push to Main**__ 🌳",
                    url: $url,
                    description: "**\($actor)** pushed directly to `\($ref)`.\n\n> \($commit)"
                  }
                end
              ]
            }')

          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK_URL

      # Step 2: Feature Branches
      - name: Notify Feature Branch (Smart Detection)
        if: github.ref != 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PARENT_COUNT=$(git log -1 --format=%P | wc -w)
          SUBJECT=$(git log -1 --format=%s)

          if [ "$PARENT_COUNT" -gt 1 ]; then
            IS_MERGE="true"
            SOURCE_BRANCH=$(echo "$SUBJECT" | grep -oP "(?<=Merge branch ')[^']+" || true)
            if [ -z "$SOURCE_BRANCH" ]; then
              SOURCE_BRANCH=$(echo "$SUBJECT" | grep -oP "(?<=from )[^ ]+" | cut -d'/' -f2- || true)
            fi
            if [ -z "$SOURCE_BRANCH" ]; then
              SOURCE_BRANCH="another branch"
            fi
          else
            IS_MERGE="false"
            SOURCE_BRANCH=""
          fi

          PAYLOAD=$(jq -n \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg url "${{ github.event.compare }}" \
            --arg is_merge "$IS_MERGE" \
            --arg source "$SOURCE_BRANCH" \
            '{
              username: "GitHub",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                if $is_merge == "true" then
                  {
                    color: 8540383,
                    title: "🛤 Code Merged into Branch 🛤",
                    url: $url,
                    description: "__**\($actor)** merged `\($source)` into `\($ref)`.__\n\n> \($commit)"
                  }
                else
                  {
                    color: 13801762,
                    title: "🌱 Push to Branch 🌱",
                    url: $url,
                    description: "__**\($actor)** pushed to `\($ref)`.__\n\n> \($commit)"
                  }
                end
              ]
            }')

          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK_URL