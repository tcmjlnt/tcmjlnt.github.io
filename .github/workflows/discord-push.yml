name: Discord Push Notifications

on:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # 1. Inspect the commit history
          PARENT_COUNT=$(git log -1 --format=%P | wc -w)
          SUBJECT=$(git log -1 --format=%s)
          REF_NAME="${{ github.ref_name }}"

          # 2. Extract merge data if applicable
          if [ "$PARENT_COUNT" -gt 1 ]; then
            IS_MERGE="true"
            SOURCE_BRANCH=$(echo "$SUBJECT" | grep -oP "(?<=')[^']+(?=')" | head -n 1 || true)
            if [ -z "$SOURCE_BRANCH" ]; then
              SOURCE_BRANCH=$(echo "$SUBJECT" | grep -oP "(?<=from )[^ ]+" | cut -d'/' -f2- || true)
            fi
            if [ -z "$SOURCE_BRANCH" ]; then
              SOURCE_BRANCH="another branch"
            fi
            SOURCE_BRANCH=${SOURCE_BRANCH#origin/}
          else
            IS_MERGE="false"
            SOURCE_BRANCH=""
          fi

          # 3. Dynamically assign Colors and Titles based on branch and merge status
          if [ "$REF_NAME" = "main" ]; then
            if [ "$IS_MERGE" = "true" ]; then
              COLOR=616922
              TITLE="🚀 Code Merged into Main 🚀"
            else
              COLOR=2328118
              TITLE="🌳 Push to Main 🌳"
            fi
          else
            if [ "$IS_MERGE" = "true" ]; then
              COLOR=8540383
              TITLE="🛤 Code Merged into Branch 🛤"
            else
              COLOR=13801762
              TITLE="🌱 Push to Branch 🌱"
            fi
          fi

          # 4. Safely build the JSON payload (passing bash variables to jq)
          PAYLOAD=$(jq -n \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg ref "$REF_NAME" \
            --arg url "${{ github.event.compare }}" \
            --arg source "$SOURCE_BRANCH" \
            --arg title "$TITLE" \
            --arg is_merge "$IS_MERGE" \
            --argjson color "$COLOR" \
            '{
              username: "GitHub",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [{
                color: $color,
                title: $title,
                url: $url,
                description: (
                  if $is_merge == "true" then
                    "__**\($actor)** merged `\($source)` into `\($ref)`.__\n\n> \($commit)"
                  else
                    "__**\($actor)** pushed directly to `\($ref)`.__\n\n> \($commit)"
                  end
                )
              }]
            }')

          # 5. Fire the webhook
          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK_URL