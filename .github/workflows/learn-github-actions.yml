name: learn-github-actions
# Optional - The name of the workflow as it will appear in the "Actions" tab of the GitHub repository.
# If this field is omitted, the name of the workflow file will be used instead.

run-name: ${{ github.actor }} is learning GitHub Actions
# Optional - The name for workflow runs generated from the workflow, which will appear in the list of workflow runs on your repository's "Actions" tab.

on: [push] # Specifies the trigger for this workflow. This example uses the push event, so a workflow run is triggered every time someone pushes a change to the repository or merges a pull request.
jobs: # Groups together all the jobs that run in the learn-github-actions workflow.
  check-bats-version: # Defines a job named check-bats-version. The child keys will define properties of the job.
    runs-on: ubuntu-latest # Configures the job to run on the latest version of an Ubuntu Linux runner. This means that the job will execute on a fresh virtual machine hosted by GitHub.
    steps: # Groups together all the steps that run in the check-bats-version job.
      - uses: actions/checkout@v6 # The uses keyword specifies that this step will run the actions/checkout@v6 action. You should use the checkout action any time your workflow will use the repository's code.
      - uses: actions/setup-node@v7 # This step uses the actions/setup-node@v7 action to install the specified version of the Node.js.
        with:
          node-version: '24'
      - run: npm install -g bats # The run keyword tells the job to execute a command on the runner.
      - run: bats -v # Finally, you'll run the bats command with a parameter that outputs the software version.
